name: core-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      typescript_ref:
        description: "TypeScript revision for coordinated interoperability (branch, tag, or full SHA)"
        required: false
        default: main
      python_ref:
        description: "Python revision for coordinated interoperability (branch, tag, or full SHA)"
        required: false
        default: main

jobs:
  docs:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/SPECIFICATION.md
          test -f PROJECT_STATE.md
          test -f ROADMAP.md
          node scripts/validate_workflow_refs.mjs
          node scripts/validate_phase1.mjs
          node --test tests/validate_phase1.test.mjs
          ! grep -R -n -E 'TODO|TBD|coming soon' README.md docs PROJECT_STATE.md
      - name: Rust format
        run: cargo fmt -- --check
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --all-targets
      - name: Cargo dependency metadata
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Package validation
        run: cargo package --locked --allow-dirty --no-verify

  interoperability:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ReproPack/repropack-typescript
          path: repropack-typescript
          ref: ${{ inputs.typescript_ref || 'main' }}
      - uses: actions/checkout@v4
        with:
          repository: ReproPack/repropack-python
          path: repropack-python
          ref: ${{ inputs.python_ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repropack-typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record interoperability revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing Core revision: $(git rev-parse HEAD)"
          echo "Testing TypeScript revision: $(git -C repropack-typescript rev-parse HEAD)"
          echo "Testing Python revision: $(git -C repropack-python rev-parse HEAD)"
      - name: Build TypeScript implementation
        working-directory: repropack-typescript
        run: npm ci && npm run build
      - name: Run interoperability matrix
        env:
          REPROPACK_TYPESCRIPT: ${{ github.workspace }}/repropack-typescript
          REPROPACK_PYTHON_PROJECT: ${{ github.workspace }}/repropack-python
          REPROPACK_PYTHON: python
        run: node scripts/phase8_interop.mjs
